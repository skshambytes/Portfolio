services:
  # Backend API Service
  - type: web
    name: saksham-portfolio-api
    env: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_TO_EMAIL
        value: rajsaksham744@gmail.com
      - key: CONTACT_FROM_EMAIL
        value: "Saksham Raj Portfolio" <rajsaksham744@gmail.com>
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: IP_HASH_SALT
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false
